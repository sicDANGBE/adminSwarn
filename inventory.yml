all:
  vars:
    sysadmin_user: supadmin
    ansible_user: supadmin
    ansible_port: 49281
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: yes
    local_public_key: "~/.ssh/id_rsa.pub"
    main_domain: dgsynthex.online

  children:
    wireguard_mesh:
      children:
        wireguard_ovh_peers:
          hosts:
            ovh.core:
            ovh.worker.01:
            ovh.worker.02:
        wireguard_raspberry:
          hosts:
            raspberry.media:
              ansible_host: rpi
              ansible_user: supadmin
              ansible_port: 22
    k8s_cluster:
      children:
        server:
          hosts:
            ovh.core:
        agents:
          hosts:
            ovh.worker.01:
            ovh.worker.02:
