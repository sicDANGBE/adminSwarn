---
- name: "Infrastructure système"
  hosts: k8s_cluster
  become: true
  handlers:
    - name: Restart Rsyslog
      service: name=rsyslog state=restarted

    - name: Reload NFTables
      service: name=nftables state=reloaded

    - name: Restart SSH
      service: name=ssh state=restarted

  roles:
    - role: clean
      tags: ["never", "clean"]
    - role: common
      tags: ["common", "system"]

- name: "WireGuard - Bootstrap des clés"
  hosts: wireguard_mesh
  become: true
  any_errors_fatal: true
  tags: ["wireguard", "vpn", "wireguard_keys"]
  roles:
    - role: wireguard
      vars:
        wireguard_manage_mode: keys

- name: "WireGuard - Configuration des peers"
  hosts: wireguard_mesh
  become: true
  any_errors_fatal: true
  tags: ["wireguard", "vpn", "wireguard_config"]
  roles:
    - role: wireguard
      vars:
        wireguard_manage_mode: config

- name: "Cluster Kubernetes - Nettoyage des routes legacy WireGuard"
  hosts: agents
  become: true
  tags: ["wireguard", "routing", "routing_cleanup"]
  roles:
    - role: static_routes

- name: "Cluster Kubernetes"
  hosts: k8s_cluster
  become: true
  tags: ["k8s", "kubernetes"]
  handlers:
    - name: Reload NFTables
      service: name=nftables state=reloaded

  roles:
    - k8s

- name: "Applications Kubernetes"
  hosts: server
  become: true
  tags: ["app_k8s"]
  
  roles:
    - app_k8s

- name: "Runners Kubernetes"
  hosts: server
  become: true
  tags: ["k8s_runner"]
  
  roles:
    - runner

- name: "Audit de securite"
  hosts: k8s_cluster
  become: true
  gather_facts: true
  tags: ["never", "audit"]
  roles:
    - audit_security
